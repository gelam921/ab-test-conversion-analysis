version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: abtest_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  analysis:
    build:
      context: .
      dockerfile: Dockerfile.analysis
    volumes:
      - ./analysis:/app/analysis
      - ./data:/app/data
    env_file:
      - .env
    depends_on:
      - postgres

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.analysis
    container_name: abtest_dashboard
    restart: always
    volumes:
      - ./dashboard:/app/dashboard
    env_file:
      - .env
    depends_on:
      - postgres
    ports:
      - "8502:8501"
    command: streamlit run dashboard/app.py --server.port=8501 --server.address=0.0.0.0

volumes:
  pg_data:
